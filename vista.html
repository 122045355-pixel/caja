<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>

    <style>

        body{
            font-family: Arial;
            margin: 30px;
        }

        .contenedor{
            display: flex;
            gap: 40px;
        }

        .modulo{
            border: 1px solid black;
            padding: 20px;
            width: 300px;
        }

        input{
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
        }

        button{
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>Sistema de Gestión de Pedidos</h1>

    <div class="contenedor">

        
        <div class="modulo">

            <h2>Nuevo Pedido</h2>

            <input type="text" id="cliente" placeholder="Cliente">

            <input type="text" id="producto" placeholder="Producto">

            <input type="number" id="cantidad" placeholder="Cantidad">

            <input type="number" id="precio" placeholder="Precio">

            <button onclick="guardarPedido()">
            
            </button>

        </div>


        <!-- MODULO LISTA -->
        <div class="modulo">

            <h2>Lista de Pedidos</h2>

            <ul id="listaPedidos"></ul>

            <h3 id="ventasTotales">
                Total ventas: $0
            </h3>

        </div>

    </div>


   
    <script src="caja.js"></script>

    <script>

        function guardarPedido(){

            let cliente = document.getElementById("cliente").value;

            let producto = document.getElementById("producto").value;

            let cantidad = Number(document.getElementById("cantidad").value);

            let precio = Number(document.getElementById("precio").value);


            
            agregarPedido(cliente, producto, cantidad, precio);


           
            let lista = document.getElementById("listaPedidos");

            let nuevo = document.createElement("li");

            nuevo.textContent =
            `${cliente} - ${producto} - ${cantidad} x $${precio}`;

            lista.appendChild(nuevo);


            
            document.getElementById("ventasTotales").textContent =
            `Total ventas: $${totalVentas}`;

        }

    </script>

</body>
</html>
